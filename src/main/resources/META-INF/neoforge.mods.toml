modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

# This is a URL to e.g. your GitHub or CurseForge issues page.
# It will appear in any crash reports this mod is directly involved in.
# issueTrackerURL="https://github.com/invalid/pleasechangeme/issues" #optional
# A list of mods - how many allowed here is determined by the individual mod loader

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    mixinConfigs = "phoenix_chronicles.mixins.json"
    displayURL = "${mod_url}"
    # This will be displayed as your mod's logo in the Mods panel.
    # logoFile="icon.png" #optional
    # Some more fluff displayed in the Mods panel. Feel free to issue your special thanks here!
    # credits="Thanks to Mojang for making this great game" #optional
    # Some more fluff displayed in the Mods panel. Plug your stuff here!
    authors="${mod_author}"
    description = '''
Welcome to Phoenix's Chronicles, the next gen quest mod! Meant to be better than ftbquests if that is your fancy.
'''

    [[dependencies.${mod_id}]]
        modId = "neoforge"
        mandatory = true
        versionRange = "[${neoforge_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "gtceu"
        mandatory = false
        versionRange = "[${gtceu_version},)"
        ordering = "AFTER"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "phoenix_guilds"
        mandatory = false
        versionRange = "[0.1.0,)"
        ordering = "AFTER"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId="phoenix_wiki"
        mandatory=true
        versionRange="[0.3.0,)"
        ordering="NONE"
        side="BOTH"
    # TODO: Phoenix-Archive has no 1.21.1/NeoForge build yet -- its dependency entry (and the
    # matching build.gradle dependency) is commented out until that repo is ported too.
    #[[dependencies.${mod_id}]]
