plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.diffplug.spotless' version '7.0.2'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com/'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Devos Snapshot Maven'
        url = 'https://mvn.devos.one/snapshots/'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'LatvianDev Maven'
        url = 'https://maven.latvian.dev/releases/'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'TheIllusiveC4 Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Architectury Maven'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Repsy Toma Maven'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.rtyley'
        }
    }
    maven {
        name = 'FTB Maven'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'ModMaven'
        url = 'https://maven.modmaven.dev/'
        content {
            includeGroup 'org.appliedenergistics'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Repsy'
        url = uri('https://repo.repsy.io/mvn/user75142941/phoenixsuite')
    }
    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Phoenix suite
    jarJar(implementation("net.phoenixvine.wiki:neoforge:${phoenix_wiki_version}")) {
        version { strictly "[${phoenix_wiki_version},)"; prefer phoenix_wiki_version }
    }

    // Optional integrations
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "curse.maven:phoenixs-chromatic-colors-1483210:8388618"
    compileOnly "net.phoenixvine.guilds:phoenix-guilds-neoforge:${phoenix_guilds_version}"
    compileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}") { transitive = false }
    compileOnly("brachy.modularui:modularui-mc${minecraft_version}:${mui_version}") { transitive = false }

    // GregTech in the dev client, so its hooks can be exercised
    localRuntime "curse.maven:phoenixs-chromatic-colors-1483210:8388618"
    localRuntime "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    localRuntime "com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}"
    localRuntime "brachy.modularui:modularui-mc${minecraft_version}:${mui_version}"
    localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_author             : mod_author,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Repsy'
            url = uri('https://repo.repsy.io/mvn/user75142941/phoenixsuite')
            credentials {
                username = project.findProperty('repsyUsername') ?: System.getenv('REPSY_USERNAME')
                password = project.findProperty('repsyPassword') ?: System.getenv('REPSY_PASSWORD')
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
