plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev' version '2.0.5-beta'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = "Repsy"
        url = uri("https://repo.repsy.io/mvn/user75142941/phoenixsuite")
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
    maven {
        // EMI
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = "https://maven.architectury.dev"
    }
    maven {
        // KubeJS, Rhino
        name = "LatvianModder"
        url = "https://maven.latvian.dev/releases"
    }
    maven {
        // Applied Energistics 2
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        name = 'Repsy Toma Maven'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
    flatDir {
        dir 'libs'
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

// Minecraft 1.21.1 requires Java 21
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21 }

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.main
            systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI, EMI, Jade
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    runtimeOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")
    runtimeOnly("curse.maven:jade-324717:8591319")
    compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")

    // TODO: Phantasia has no 1.21.1/NeoForge build yet -- re-enable once it's ported.
    // compileOnly("net.phoenix.core:Phantasia:${phantasia_version}")
    // runtimeOnly("net.phoenix.core:Phantasia:${phantasia_version}")

    runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}")
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}")
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}")

    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    runtimeOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

    compileOnly("dev.latvian.mods:rhino:${rhino_version}")
    runtimeOnly("dev.latvian.mods:rhino:${rhino_version}")

    compileOnly("org.appliedenergistics:appliedenergistics2:${appeng_version}")
    runtimeOnly("org.appliedenergistics:appliedenergistics2:${appeng_version}")

    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    runtimeOnly("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}")
  //  runtimeOnly("dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}")

    // NOTE: interaction with phoenix_guilds is being ported separately -- dependency kept so the
    // classpath resolves, but the Java side using it is not expected to compile yet.
    compileOnly('net.phoenixvine.guilds:phoenix_guilds-neoforge:1.6.3')
    runtimeOnly('net.phoenixvine.guilds:phoenix_guilds-neoforge:1.6.3')

    jarJar(implementation("net.phoenixvine.wiki:phoenix_wiki-neoforge:0.3.0"))

    // TODO: Phoenix-Archive and PhoenixCore have no 1.21.1/NeoForge build yet -- re-enable once
    // those repos are ported too.
    // compileOnly("net.phoenix.phoenix_archive:phoenix_archive:${phoenix_archive_version}")
    // runtimeOnly("net.phoenix.phoenix_archive:phoenix_archive:${phoenix_archive_version}")
    // compileOnly("net.phoenix.core:PhoenixCore:${phoenixcore_version}:slim") { transitive = false }

    compileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") { transitive = false }
    compileOnly("com.lowdragmc.ldlib:ldlib-neoforge-${minecraft_version}:${ldlib_version}") { transitive = false }
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("dev.toma.configuration:configuration-${minecraft_version}:${configuration_version}")
    runtimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") { transitive = false }
    runtimeOnly("com.lowdragmc.ldlib:ldlib-neoforge-${minecraft_version}:${ldlib_version}") { transitive = false }
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    runtimeOnly("dev.toma.configuration:configuration-${minecraft_version}:${configuration_version}")

    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "neoforge_version": neoforge_version,
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
    options.compilerArgs << "-Aquiet=true"
}

tasks.register('publishToDomains', Copy) {
    group = 'phoenix'
    description = 'Builds this mod and copies the jar into ../Phoenix-Domains/libs, so Domains picks up local changes.'
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into '../Phoenix-Domains/libs'
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "Repsy"
            url = uri("https://repo.repsy.io/mvn/user75142941/phoenixsuite")
            credentials {
                username = project.findProperty("repsyUsername") ?: System.getenv("REPSY_USERNAME")
                password = project.findProperty("repsyPassword") ?: System.getenv("REPSY_PASSWORD")
            }
        }
    }
}
